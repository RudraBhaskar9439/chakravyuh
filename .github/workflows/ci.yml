name: continuous-integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a private repository
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$IS_PRIVATE" = "true"

  backend:
    needs: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chakravyuh_test
          POSTGRES_USER: chakravyuh
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chakravyuh -d chakravyuh_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/test-only-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 >/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      CHAKRAVYUH_ENVIRONMENT: test
      CHAKRAVYUH_POSTGRES_DSN: postgresql+asyncpg://chakravyuh:test-only@localhost:5432/chakravyuh_test
      CHAKRAVYUH_TEST_POSTGRES_DSN: postgresql+asyncpg://chakravyuh:test-only@localhost:5432/chakravyuh_test
      CHAKRAVYUH_NEO4J_URI: bolt://localhost:7687
      CHAKRAVYUH_NEO4J_PASSWORD: test-only-password
      CHAKRAVYUH_TEST_NEO4J_URI: bolt://localhost:7687
      CHAKRAVYUH_TEST_NEO4J_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.27"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run chakravyuh-judge-demo --seed-count 25

  web:
    needs: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:check
      - run: pnpm web:test
      - run: pnpm web:build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, web]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag chakravyuh-api:test .
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'test "$(id -u)" != "0"'
      - run: docker run --rm chakravyuh-api:test alembic heads
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'command -v chakravyuh-worker'
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'command -v chakravyuh-simulate'
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'command -v chakravyuh-evaluate-invariants'
      - run: docker run --rm chakravyuh-api:test chakravyuh-evaluate-invariants --seed-count 1
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'command -v chakravyuh-journey-replay'
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'command -v chakravyuh-projector'
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'command -v chakravyuh-graph-rebuild'
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'command -v chakravyuh-diagnosis-worker'
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'command -v chakravyuh-operator-token'
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'command -v chakravyuh-judge-demo'
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'command -v chakravyuh-load-probe'
      - run: docker run --rm chakravyuh-api:test chakravyuh-judge-demo --seed-count 5
      - run: docker build --file apps/web/Dockerfile --tag chakravyuh-web:test .
      - run: docker run --rm --entrypoint sh chakravyuh-web:test -c 'test "$(id -u)" != "0"'
