name: continuous-integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a private repository
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$IS_PRIVATE" = "true"

  backend:
    needs: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chakravyuh_test
          POSTGRES_USER: chakravyuh
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chakravyuh -d chakravyuh_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CHAKRAVYUH_ENVIRONMENT: test
      CHAKRAVYUH_POSTGRES_DSN: postgresql+asyncpg://chakravyuh:test-only@localhost:5432/chakravyuh_test
      CHAKRAVYUH_TEST_POSTGRES_DSN: postgresql+asyncpg://chakravyuh:test-only@localhost:5432/chakravyuh_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.27"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy
      - run: uv run pytest

  web:
    needs: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:check
      - run: pnpm web:test
      - run: pnpm web:build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, web]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag chakravyuh-api:test .
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'test "$(id -u)" != "0"'
      - run: docker run --rm chakravyuh-api:test alembic heads
      - run: docker run --rm --entrypoint sh chakravyuh-api:test -c 'command -v chakravyuh-worker'
      - run: docker build --file apps/web/Dockerfile --tag chakravyuh-web:test .
