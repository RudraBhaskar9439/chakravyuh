name: continuous-integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a private repository
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$IS_PRIVATE" = "true"

  backend:
    needs: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest

  web:
    needs: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:check
      - run: pnpm web:test
      - run: pnpm web:build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, web]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag chakravyuh-api:test .
      - run: docker build --file apps/web/Dockerfile --tag chakravyuh-web:test .
