apiVersion: apps/v1
kind: Deployment
metadata:
  name: chakravyuh-worker
  labels:
    app.kubernetes.io/name: chakravyuh-worker
    app.kubernetes.io/version: 0.11.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chakravyuh-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chakravyuh-worker
        app.kubernetes.io/part-of: chakravyuh
    spec:
      serviceAccountName: chakravyuh-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/rudrabhaskar9439/chakravyuh-api:0.11.0
          args: ["chakravyuh-worker"]
          envFrom:
            - configMapRef:
                name: chakravyuh-runtime
            - secretRef:
                name: chakravyuh-postgres-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
