apiVersion: apps/v1
kind: Deployment
metadata:
  name: chakravyuh-web
  labels:
    app.kubernetes.io/name: chakravyuh-web
    app.kubernetes.io/version: 0.10.0
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chakravyuh-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chakravyuh-web
        app.kubernetes.io/part-of: chakravyuh
    spec:
      serviceAccountName: chakravyuh-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/rudrabhaskar9439/chakravyuh-web:0.10.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chakravyuh-web
spec:
  selector:
    app.kubernetes.io/name: chakravyuh-web
  ports:
    - name: http
      port: 3000
      targetPort: http
